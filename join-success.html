<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thank You – Bogong Rugby Club</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: "Open Sans", Arial, sans-serif;
      background: #f6f7f4;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .card {
      background: white;
      padding: 30px 26px;
      max-width: 420px;
      text-align: center;
      border-radius: 10px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.12);
      border-top: 6px solid #004d00;
    }

    h1 {
      font-family: "Montserrat", Arial, sans-serif;
      color: #004d00;
      margin-bottom: 10px;
    }

    p { margin: 6px 0; }

    .btn {
      display: inline-block;
      margin-top: 18px;
      padding: 10px 20px;
      border-radius: 999px;
      border: none;
      background: #004d00;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }

    .btn:hover {
      background: #267f00;
    }

    .icon {
      font-size: 2.5rem;
      color: #29a329;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="icon">
      <i class="fa fa-check-circle"></i>
    </div>
    <h1>Thank You!</h1>
    <p>Your expression of interest has been received.</p>
    <p>One of our Bogong Rugby Club representatives will be in touch soon.</p>
    <p>Check your email and keep an eye on our socials for training updates.</p>

    <a href="index.html" class="btn">Back to Home</a>
  </div>

</body>
</html>
